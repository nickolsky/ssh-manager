<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>terminal</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root {
    --bg: #1f1f1f; --fg: #e6e6e6; --muted: #9a9a9a;
    --pop-bg: #2b2b2b; --pop-border: #454545; --pop-sel: #04395e; --pop-match: #4fb6ff; --ghost: #7a7a7a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #term { position: absolute; inset: 6px 4px 4px 10px; }
  .xterm .xterm-viewport { scrollbar-width: thin; }
  #banner {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font: 14px "Segoe UI", sans-serif; color: var(--muted); text-align: center; pointer-events: none;
    display: none; white-space: pre-line;
  }
  /* suggestions */
  #suggest {
    position: absolute; z-index: 20; display: none; min-width: 220px; max-width: 640px; max-height: 262px; overflow-y: auto;
    background: var(--pop-bg); border: 1px solid var(--pop-border); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    font: 13px "Cascadia Mono", Consolas, monospace; color: var(--fg); padding: 3px 0; scrollbar-width: thin;
  }
  #suggest .it { display: flex; align-items: center; gap: 8px; padding: 2px 10px 2px 8px; height: 20px; cursor: default; white-space: nowrap; }
  #suggest .it.sel { background: var(--pop-sel); }
  #suggest .ic { font: 12px "Segoe Fluent Icons", "Segoe MDL2 Assets"; width: 14px; text-align: center; color: var(--muted); flex: none; }
  #suggest .lb { overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
  #suggest .lb b { color: var(--pop-match); font-weight: normal; }
  #suggest .dt { color: var(--muted); font: 12px "Segoe UI", sans-serif; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 260px; margin-left: 12px; }
  #suggest .hint { color: var(--muted); font: 11px "Segoe UI", sans-serif; padding: 3px 10px 1px; border-top: 1px solid var(--pop-border); margin-top: 3px; }
  #ghost { position: absolute; z-index: 10; display: none; pointer-events: none; white-space: pre; color: var(--ghost); overflow: hidden; }
</style>
</head>
<body>
<div id="term"></div>
<div id="banner"></div>
<div id="ghost"></div>
<div id="suggest"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="vendor/addon-unicode11.js"></script>
<script src="terminal.js"></script>
</body>
</html>
